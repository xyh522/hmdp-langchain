# 复制为 application.yaml，再按实际部署环境填写连接信息。
server:
  port: 8081

agent:
  base-url: http://127.0.0.1:8000

spring:
  application:
    name: hmdp
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp
    username: root
    password: ${DB_PASSWORD}
  redis:
    host: 127.0.0.1
    port: 6379
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: hmms
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /hmms
    connection-timeout: 60000
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        concurrency: 1
        max-concurrency: 3
        retry:
          enabled: false
        default-requeue-rejected: false
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  type-aliases-package: com.hmdp.entity

logging:
  level:
    com.hmdp: debug
  pattern:
    dateformat: mm:ss.SSS
