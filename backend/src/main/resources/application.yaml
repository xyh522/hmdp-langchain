server:
  port: 8081
agent:
  base-url: http://127.0.0.1:8000
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://192.168.140.128:3306/hmdp
    username: root
    password: 1234
  redis:
    host: 192.168.140.128
    port: 6379
    password: 1234
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  rabbitmq:
    host: 192.168.140.128
    port: 5672
    username: hmms
    password: 1234
    virtual-host: /hmms
    # 连接配置
    connection-timeout: 60000
    # 消费者配置
    listener:
      simple:
        # 手动确认消息
        acknowledge-mode: manual
        # 每次从队列中取出的消息数量
        prefetch: 1
        # 消费者线程数
        concurrency: 1
        max-concurrency: 3
        # 重试配置
        retry:
          enabled: false  # 禁用自动重试，使用手动重试逻辑
        # 默认重新入队
        default-requeue-rejected: false



mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug
  pattern:
    dateformat: mm:ss.SSS
